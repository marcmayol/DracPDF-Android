[versions]
agp = "8.9.1"
kotlin = "2.0.21"
coroutines = "1.9.0"
composeBom = "2026.06.00"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
datastore = "1.1.1"
work = "2.9.1"
# El mismo MuPDF que PyMuPDF 1.28.0 usa en el DracPDF de escritorio: mismo motor C,
# misma versión, mismo comportamiento en render, formularios y texto estructurado.
mupdf = "1.28.0"
# PDFBox para Android (tom-roush): es quien firma. MuPDF sabe rellenar y dibujar, pero
# no sabe construir una firma PAdES, y pyHanko —lo que usa el escritorio— no existe
# aquí. Los dos motores conviven por fichero, como en el escritorio.
pdfbox = "2.0.27.0"
junit = "4.13.2"
# Las de test van por delante del resto a propósito: hasta la 1.7.0 / 3.7.0, la
# instrumentación llama a android.hardware.input.InputManager.getInstance(), que ya no
# existe en Android 17, y todo test instrumentado revienta en un móvil actual (el Pixel
# del usuario) aunque pase en el emulador.
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
espresso = "3.7.0"
ktlint = "12.1.1"
detekt = "1.23.7"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.15.0" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }

mupdf-fitz = { module = "com.artifex.mupdf:fitz", version.ref = "mupdf" }

# Trae consigo Bouncy Castle (bcprov + bcpkix, jdk15to18): no se declaran aparte para
# no acabar con dos Bouncy Castle distintos en el mismo APK.
pdfbox-android = { module = "com.tom-roush:pdfbox-android", version.ref = "pdfbox" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
