# Ajustes sobre la configuración por defecto de detekt (buildUponDefaultConfig).
# Se toca lo mínimo, y siempre por anotación en vez de por ruta: lo que justifica la
# excepción es ser un composable, no estar en tal carpeta.

complexity:
  LongMethod:
    # Un composable de pantalla es largo por naturaleza; partirlo para cumplir un
    # número no lo hace más legible.
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable', 'Preview']
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20

style:
  MagicNumber:
    # Las medidas del diseño (56 dp, 80 dp, 24 dp...) y los colores (0xFFE0534A) son
    # literales por definición: bautizarlos otra vez no explica nada que el nombre de
    # la propiedad no diga ya.
    ignorePropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
    excludes: ['**/test/**', '**/androidTest/**']
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    # Cuatro salidas, y las guardas de cabecera aparte: cuando una función tiene que
    # comprobar tres cosas antes de trabajar —que hay documento, que la página existe,
    # que no se está pidiendo ya— salir pronto de cada una se lee mejor que anidar el
    # cuerpo entero dentro de tres if.
    max: 4
    excludeGuardClauses: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']

naming:
  FunctionNaming:
    # Los composables van en PascalCase, como manda Compose.
    ignoreAnnotated: ['Composable']
